
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Âm nhạc của tôi</title>

<style>
:root {
  --bg:#080808;
  --gold:#ffd400;
  --gold2:#ffb900;
  --white:#fff;
  --muted:#bdbdbd;
  --line:#66551b;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Arial,system-ui,sans-serif;
  background:
    radial-gradient(ellipse at 50% 35%,#302900 0%,#151308 40%,#080808 78%);
}

.wrap {
  width:min(680px,100%);
  margin:auto;
  padding:25px 16px 40px;
}

header {
  text-align:center;
  padding:18px 5px 25px;
}

.eyebrow {
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  letter-spacing:4px;
}

h1 {
  font-size:clamp(27px,7vw,38px);
  margin:13px 0 8px;
  font-weight:900;
}

.sub {
  color:#c8c8c8;
  font-size:15px;
  margin:0;
}

.player {
  background:linear-gradient(145deg,#24200e,#100f09);
  border:1px solid #65551c;
  border-radius:28px;
  padding:28px 20px 24px;
  box-shadow:0 0 35px #ffd40018;
}

.art {
  width:145px;
  height:145px;
  border-radius:50%;
  margin:8px auto 25px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 35% 28%,
    #fff9a5 0%,#ffe94a 20%,#ffd000 48%,
    #bd8d00 78%,#594000 100%);
  box-shadow:
    0 0 28px #ffd40088,
    0 0 65px #ffd40033,
    inset -10px -12px 18px #6e4b0090;
}

.be-logo {
  color:#ff2020;
  font-size:clamp(14px, 4vw, 19px);
  font-weight:900;
  letter-spacing:-0.5px;
  white-space:nowrap;
  text-shadow:0 0 8px #ff2020;
}
}

.track-title {
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin:0;
  overflow-wrap:anywhere;
}

.artist {
  text-align:center;
  color:var(--muted);
  font-size:15px;
  margin:7px 0 25px;
}

.visualizer {
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin:0 auto 20px;
}

.visualizer i {
  width:5px;
  height:9px;
  border-radius:9px;
  background:var(--gold);
}

.visualizer.playing i {
  animation:wave .7s ease-in-out infinite alternate;
}

.visualizer i:nth-child(3n) {
  animation-delay:-.3s;
}

.visualizer i:nth-child(3n+1) {
  animation-delay:-.15s;
}

@keyframes wave {
  from { transform:scaleY(.5); }
  to { transform:scaleY(3); }
}

.progress {
  width:100%;
  accent-color:var(--gold);
  cursor:pointer;
}

.times {
  display:flex;
  justify-content:space-between;
  color:#c7c7c7;
  font-size:13px;
  margin-top:7px;
}

.controls {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:35px;
  margin:28px 0 10px;
}

button {
  color:inherit;
  border:0;
  cursor:pointer;
}

.plain {
  background:transparent;
  color:white;
  font-size:25px;
  padding:9px;
}

.play {
  width:85px;
  height:85px;
  border-radius:50%;
  color:#171000;
  background:var(--gold);
  font-size:29px;
  font-weight:900;
  box-shadow:0 0 30px #ffd40066;
}

.status {
  text-align:center;
  color:#c6c6c6;
  font-size:13px;
  min-height:20px;
  margin-top:13px;
}

.error {
  display:none;
  color:#ffb4b4;
  background:#3a1b25;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  margin-top:12px;
}

.list-title {
  font-size:14px;
  color:var(--gold);
  letter-spacing:3px;
  margin:28px 4px 13px;
  font-weight:800;
}

.playlist {
  display:grid;
  gap:10px;
}

.song {
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  padding:15px;
  border:1px solid #4c421d;
  background:#17150d;
  border-radius:15px;
}

.song.active {
  border-color:var(--gold);
  background:#29220b;
}

.num {
  color:var(--gold);
  font-size:13px;
  width:22px;
  text-align:center;
}

.song-info {
  min-width:0;
  flex:1;
}

.song-name {
  display:block;
  font-weight:700;
  font-size:15px;
  overflow-wrap:anywhere;
}

.song-artist {
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.song-icon {
  color:var(--gold);
  font-size:20px;
}

footer {
  color:#aaa;
  font-size:12px;
  text-align:center;
  margin:25px 8px 0;
}
</style>
</head>

<body>
<main class="wrap">

<header>
  <div class="eyebrow">PERSONAL MUSIC SPACE</div>
  <h1>ÂM NHẠC CỦA TÔI</h1>
  <p class="sub">Chạm vào một bài hát và lắng nghe.</p>
</header>

<section class="player" aria-label="Trình phát nhạc">

  <div class="art" aria-hidden="true">
    <span class="be-logo">Giai điệu cà khịa</span>
  </div>

  <h2 class="track-title" id="title">Chưa chọn bài hát</h2>
  <p class="artist" id="artist">Tác giả</p>

  <div class="visualizer" id="visualizer"></div>

  <audio id="audio" preload="metadata"></audio>

  <input class="progress" id="progress"
    type="range" min="0" max="1000" value="0">

  <div class="times">
    <span id="current">00:00</span>
    <span id="duration">00:00</span>
  </div>

  <div class="controls">
    <button class="plain" id="prev">|◀</button>
    <button class="play" id="toggle">▶</button>
    <button class="plain" id="next">▶|</button>
  </div>

  <div class="status" id="status">Sẵn sàng nghe nhạc</div>
  <div class="error" id="error"></div>

</section>

<h3 class="list-title">DANH SÁCH PHÁT</h3>
<section class="playlist" id="playlist"></section>

<footer>Được chia sẻ bằng mã QR cá nhân</footer>

</main>

<script>
(() => {
  const audio = document.getElementById('audio');
  const title = document.getElementById('title');
  const artist = document.getElementById('artist');
  const playlist = document.getElementById('playlist');
  const toggle = document.getElementById('toggle');
  const progress = document.getElementById('progress');
  const current = document.getElementById('current');
  const duration = document.getElementById('duration');
  const status = document.getElementById('status');
  const error = document.getElementById('error');
  const visualizer = document.getElementById('visualizer');

  let songs = [];
  let index = -1;
  let seeking = false;

  for (let i=0; i<25; i++) {
    visualizer.appendChild(document.createElement('i'));
  }

  const time = n => {
    if (!Number.isFinite(n)) return '00:00';
    return `${Math.floor(n/60).toString().padStart(2,'0')}:${Math.floor(n%60).toString().padStart(2,'0')}`;
  };

  function renderList() {
    playlist.innerHTML = '';

    songs.forEach((song, i) => {
      const b = document.createElement('button');
      b.className = 'song' + (i === index ? ' active' : '');

      b.innerHTML = `
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <span class="song-info">
          <span class="song-name"></span>
          <span class="song-artist"></span>
        </span>
        <span class="song-icon">${i === index && !audio.paused ? '♫' : '♪'}</span>
      `;

      b.querySelector('.song-name').textContent = song.title || song.file;
      b.querySelector('.song-artist').textContent = song.artist || 'Tác giả';

      b.addEventListener('click', () => selectSong(i, true));
      playlist.appendChild(b);
    });
  }

  function selectSong(i, autoplay) {
    if (!songs.length) return;

    index = (i + songs.length) % songs.length;
    const s = songs[index];

    title.textContent = s.title || s.file;
    artist.textContent = s.artist || 'Tác giả';

    audio.src = s.file;
    audio.load();

    progress.value = 0;
    current.textContent = '00:00';
    duration.textContent = '00:00';

    error.style.display = 'none';
    status.textContent = 'Đang tải bản nhạc…';

    renderList();

    if (autoplay) {
      audio.play().catch(() => {
        status.textContent = 'Hãy nhấn nút Play để bắt đầu nghe.';
        toggle.textContent = '▶';
      });
    }
  }

  toggle.addEventListener('click', () => {
    if (index < 0 && songs.length) selectSong(0, false);
    if (index < 0) return;

    if (audio.paused) {
      audio.play().catch(() => {
        status.textContent = 'Không phát được. Hãy kiểm tra file nhạc.';
      });
    } else {
      audio.pause();
    }
  });

  document.getElementById('prev').addEventListener('click', () => {
    if (songs.length) selectSong(index <= 0 ? songs.length-1 : index-1, true);
  });

  document.getElementById('next').addEventListener('click', () => {
    if (songs.length) selectSong(index+1, true);
  });

  audio.addEventListener('play', () => {
    toggle.textContent = 'Ⅱ';
    status.textContent = 'Đang phát';
    visualizer.classList.add('playing');
    renderList();
  });

  audio.addEventListener('pause', () => {
    toggle.textContent = '▶';
    visualizer.classList.remove('playing');
    renderList();
  });

  audio.addEventListener('loadedmetadata', () => {
    duration.textContent = time(audio.duration);
    status.textContent = 'Sẵn sàng nghe nhạc';
  });

  audio.addEventListener('timeupdate', () => {
    current.textContent = time(audio.currentTime);

    if (!seeking && Number.isFinite(audio.duration) && audio.duration) {
      progress.value = String(Math.round(audio.currentTime/audio.duration*1000));
    }
  });

  audio.addEventListener('ended', () => {
    if (index < songs.length-1) {
      selectSong(index+1, true);
    } else {
      status.textContent = 'Đã phát hết danh sách';
    }
  });

  audio.addEventListener('error', () => {
    if (audio.src) {
      error.textContent = 'Không tải được file nhạc. Hãy kiểm tra tên file trong songs.json và file MP3.';
      error.style.display = 'block';
      status.textContent = 'Có lỗi khi tải nhạc';
    }
  });

  progress.addEventListener('input', () => {
    seeking = true;
    if (audio.duration) {
      current.textContent = time(Number(progress.value)/1000*audio.duration);
    }
  });

  progress.addEventListener('change', () => {
    if (audio.duration) {
      audio.currentTime = Number(progress.value)/1000*audio.duration;
    }
    seeking = false;
  });

  fetch('songs.json', {cache:'no-store'})
    .then(r => {
      if (!r.ok) throw new Error('Không tìm thấy songs.json');
      return r.json();
    })
    .then(data => {
      songs = Array.isArray(data) ? data : (Array.isArray(data.songs) ? data.songs : []);

      if (!songs.length) {
        throw new Error('Danh sách nhạc đang trống.');
      }

      renderList();
      selectSong(0, false);
      status.textContent = 'Chọn bài hát rồi nhấn Play để nghe.';
    })
    .catch(e => {
      error.textContent = e.message;
      error.style.display = 'block';
      status.textContent = 'Chưa tải được danh sách nhạc';
    });

})();
</script>

</body>
</html>
