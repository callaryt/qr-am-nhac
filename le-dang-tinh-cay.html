
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080914">
<title>Lệ Đắng Tình Cay (Remix)</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:25px 18px;
 background:
 radial-gradient(ellipse at top,#292044,#090a15 65%);
 color:white;
 font-family:Arial,sans-serif;
 display:flex;
 justify-content:center;
 align-items:center;
}

.player{
 width:100%;
 max-width:420px;
 text-align:center;
}

.brand{
 color:#d5b8ff;
 font-size:13px;
 letter-spacing:5px;
 margin-bottom:20px;
}

.cover{
 width:100%;
 aspect-ratio:2/3;
 max-height:520px;
 object-fit:cover;
 border-radius:17px;
 box-shadow:0 15px 45px #000b;
}

h1{
 font-size:24px;
 margin:23px 0 8px;
}

.artist{
 color:#aaa;
 font-size:14px;
}

.progress-area{
 margin-top:30px;
}

input[type=range]{
 width:100%;
 accent-color:#d8aaff;
 cursor:pointer;
}

.times{
 display:flex;
 justify-content:space-between;
 color:#bbb;
 font-size:12px;
}

.controls{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:30px;
 margin:28px 0;
}

button{
 border:0;
 color:white;
 background:transparent;
 cursor:pointer;
}

.play{
 width:76px;
 height:76px;
 border-radius:50%;
 background:linear-gradient(145deg,#c38bff,#7553c8);
 font-size:30px;
 box-shadow:0 0 30px #a56cff80;
}

.side{
 font-size:25px;
}

.message{
 color:#c4a9df;
 font-style:italic;
 font-size:14px;
 margin-top:25px;
}

footer{
 color:#666;
 font-size:11px;
 margin-top:25px;
}
</style>
</head>

<body>
<div class="player">

 <div class="brand">♫ MUSIC REMIX ♫</div>

 <img class="cover"
 src="./cover.png"
 alt="Bìa album Lệ Đắng Tình Cay Remix">

 <h1>Lệ Đắng Tình Cay (Remix)</h1>
 <div class="artist">Tác giả</div>

 <audio id="audio" preload="metadata">
  <source src="./Lệ Đắng Tình Cay(remix).mp3"
  type="audio/mpeg">
 </audio>

 <div class="progress-area">
  <input id="seek" type="range"
   min="0" max="100" value="0">
  <div class="times">
   <span id="current">00:00</span>
   <span id="duration">00:00</span>
  </div>
 </div>

 <div class="controls">
  <button class="side" id="back">↺</button>
  <button class="play" id="play">▶</button>
  <button class="side" id="forward">↻</button>
 </div>

 <div class="message">
  Một giai điệu – Một cảm xúc ♡
 </div>

 <footer>PERSONAL MUSIC COLLECTION</footer>
</div>

<script>
const audio=document.getElementById("audio");
const play=document.getElementById("play");
const seek=document.getElementById("seek");
const current=document.getElementById("current");
const duration=document.getElementById("duration");

function timeFormat(t){
 if(!Number.isFinite(t)) return "00:00";
 let m=Math.floor(t/60);
 let s=Math.floor(t%60);
 return String(m).padStart(2,"0")+":"+
 String(s).padStart(2,"0");
}

play.onclick=()=>{
 if(audio.paused){
  audio.play().catch(()=>alert("Không thể phát nhạc. Hãy kiểm tra file MP3."));
 }else{
  audio.pause();
 }
};

audio.onplay=()=>play.textContent="Ⅱ";
audio.onpause=()=>play.textContent="▶";

audio.onloadedmetadata=()=>{
 duration.textContent=timeFormat(audio.duration);
};

audio.ontimeupdate=()=>{
 current.textContent=timeFormat(audio.currentTime);
 if(audio.duration){
  seek.value=audio.currentTime/audio.duration*100;
 }
};

seek.oninput=()=>{
 if(audio.duration){
  audio.currentTime=seek.value/100*audio.duration;
 }
};

document.getElementById("back").onclick=()=>{
 audio.currentTime=0;
};

document.getElementById("forward").onclick=()=>{
 if(audio.duration){
  audio.currentTime=Math.min(audio.currentTime+10,audio.duration);
 }
};
</script>
</body>
</html>
