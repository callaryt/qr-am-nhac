<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090914">
<title>Lệ Đắng Tình Cay (Remix)</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 padding:25px 16px;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(ellipse at top,#302044,#090914 75%);
 color:white;
 font-family:Arial,sans-serif;
}

.album{
 width:100%;
 max-width:420px;
 overflow:hidden;
 border-radius:24px;
 background:#10101c;
 box-shadow:0 20px 65px #000b;
 border:1px solid #ffffff15;
}

.artwork{
 height:370px;
 position:relative;
 overflow:hidden;
}

.artwork img{
 width:100%;
 height:100%;
 object-fit:cover;
 object-position:center top;
 display:block;
}

.artwork:after{
 content:"";
 position:absolute;
 inset:35% 0 0;
 background:linear-gradient(transparent,#10101c);
}

.album-content{
 position:relative;
 margin-top:-12px;
 z-index:2;
 padding:0 24px 28px;
 text-align:center;
}

.tag{
 font-size:11px;
 letter-spacing:5px;
 color:#d6aaff;
 margin-bottom:12px;
}

h1{
 font-size:23px;
 line-height:1.3;
 margin:8px 0;
}

.artist{
 color:#aaa;
 font-size:14px;
 margin-bottom:27px;
}


.visualizer{
 height:45px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:4px;
 margin-bottom:20px;
}

.visualizer span{
 width:4px;
 height:var(--h);
 border-radius:5px;
 background:linear-gradient(
   to top,
   #7865ff,
   #d46bff,
   #70dfff
 );
 box-shadow:0 0 8px #b66cff;
 transform:scaleY(0.35);
 transform-origin:center;
 animation:neonWave 0.65s ease-in-out infinite alternate;
 animation-play-state:paused;
}

.visualizer.playing span{
 animation-play-state:running;
}

.visualizer span:nth-child(2n){
 animation-duration:0.45s;
}
.visualizer span:nth-child(3n){
 animation-duration:0.8s;
}
.visualizer span:nth-child(4n){
 animation-duration:0.55s;
}

@keyframes neonWave{
 from{transform:scaleY(0.25)}
 to{transform:scaleY(1.15)}
}

.visualizer{
 height:45px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:4px;
 margin-bottom:20px;
}

.visualizer span{
 width:4px;
 height:var(--h);
 border-radius:5px;
 background:linear-gradient(
   to top,
   #7865ff,
   #d46bff,
   #70dfff
 );
 box-shadow:0 0 8px #b66cff;
 transform:scaleY(0.35);
 transform-origin:center;
 animation:neonWave 0.65s ease-in-out infinite alternate;
 animation-play-state:paused;
}

.visualizer.playing span{
 animation-play-state:running;
}

.visualizer span:nth-child(2n){
 animation-duration:0.45s;
}
.visualizer span:nth-child(3n){
 animation-duration:0.8s;
}
.visualizer span:nth-child(4n){
 animation-duration:0.55s;
}

@keyframes neonWave{
 from{transform:scaleY(0.25)}
 to{transform:scaleY(1.15)}
}

}

.progress{
 width:100%;
 accent-color:#d39bff;
 cursor:pointer;
}

.times{
 display:flex;
 justify-content:space-between;
 color:#aaa;
 font-size:12px;
 margin-top:5px;
}

.controls{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:38px;
 margin:24px 0;
}

button{
 border:0;
 background:transparent;
 color:white;
 cursor:pointer;
}

.play{
 width:76px;
 height:76px;
 border-radius:50%;
 background:linear-gradient(145deg,#d39bff,#7549bb);
 box-shadow:0 0 30px #a46bff80;
 font-size:30px;
}

.skip{
 font-size:25px;
}

.message{
 color:#d4b0ef;
 font-size:14px;
 font-style:italic;
 margin-top:15px;
}

.footer{
 color:#777;
 font-size:10px;
 letter-spacing:3px;
 margin-top:20px;
}

</style>
</head>

<body>

<div class="album">

 <div class="artwork">
  <img src="./cover.png" alt="Bìa album">
 </div>

 <div class="album-content">

  <div class="tag">♫ MUSIC REMIX ♫</div>

  <h1>Lệ Đắng Tình Cay (Remix)</h1>
  <div class="artist">Tác giả</div>

  <div class="visualizer" id="visualizer">
   <span style="--h:12px"></span>
   <span style="--h:24px"></span>
   <span style="--h:17px"></span>
   <span style="--h:32px"></span>
   <span style="--h:20px"></span>
   <span style="--h:27px"></span>
   <span style="--h:14px"></span>
   <span style="--h:35px"></span>
   <span style="--h:22px"></span>
   <span style="--h:30px"></span>
   <span style="--h:16px"></span>
   <span style="--h:26px"></span>
   <span style="--h:13px"></span>
   <span style="--h:31px"></span>
   <span style="--h:20px"></span>
   <span style="--h:28px"></span>
   <span style="--h:15px"></span>
  </div>

  <audio id="audio" preload="metadata">
   <source src="./Lệ Đắng Tình Cay(remix).mp3"
   type="audio/mpeg">
  </audio>

  <input class="progress" id="seek"
   type="range" min="0" max="100" value="0">

  <div class="times">
   <span id="current">00:00</span>
   <span id="duration">00:00</span>
  </div>

  <div class="controls">

   <button class="skip" id="back">⏮</button>

   <button class="play" id="play">▶</button>

   <button class="skip" id="forward">⏭</button>

  </div>

  <div class="message">
   Một giai điệu – Một cảm xúc ♡
  </div>

  <div class="footer">
   PERSONAL MUSIC COLLECTION
  </div>

 </div>
</div>

<script>
const audio=document.getElementById("audio");
const play=document.getElementById("play");
const seek=document.getElementById("seek");

function formatTime(t){
 if(!Number.isFinite(t)) return "00:00";
 let m=Math.floor(t/60);
 let s=Math.floor(t%60);
 return String(m).padStart(2,"0")+":"+
 String(s).padStart(2,"0");
}

play.onclick=()=>{
 if(audio.paused){
  audio.play().catch(()=>{
   alert("Không phát được nhạc. Hãy kiểm tra file MP3.");
  });
 }else{
  audio.pause();
 }
};

audio.onplay=()=>{
 play.textContent="Ⅱ";
 document.getElementById("visualizer")
 .classList.add("playing");
};

audio.onpause=()=>{
 play.textContent="▶";
 document.getElementById("visualizer")
 .classList.remove("playing");
};

audio.onended=()=>{
 play.textContent="▶";
};

audio.onloadedmetadata=()=>{
 document.getElementById("duration").textContent=
 formatTime(audio.duration);
};

audio.ontimeupdate=()=>{
 document.getElementById("current").textContent=
 formatTime(audio.currentTime);

 if(audio.duration){
  seek.value=audio.currentTime/audio.duration*100;
 }
};

seek.oninput=()=>{
 if(audio.duration){
  audio.currentTime=seek.value/100*audio.duration;
 }
};

document.getElementById("back").onclick=()=>{
 audio.currentTime=Math.max(0,audio.currentTime-10);
};

document.getElementById("forward").onclick=()=>{
 if(audio.duration){
  audio.currentTime=Math.min(
   audio.duration,audio.currentTime+10
  );
 }
};
</script>

</body>
</html>
